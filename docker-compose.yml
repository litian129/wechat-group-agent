services:
  agent:
    build: .
    image: wecom-group-agent:latest
    container_name: wecom-group-agent
    ports:
      - "8000:8000"
    environment:
      - AGENT_API_HOST=0.0.0.0
      - AGENT_API_PORT=8000
      # 日志级别: DEBUG/INFO/WARNING (排查问题时可临时调为 DEBUG)
      - AGENT_LOG_LEVEL=INFO
      # 启用大模型时配置 API Key (对应 config/llm_config.json 的 ${LLM_API_KEY})
      # - LLM_API_KEY=your-api-key
    volumes:
      # 配置文件 (修改后重启容器生效)
      - ./config:/app/config:ro
      # 输入文件夹: 放入时间戳命名的 .json 文件即自动触发任务
      - ./input:/app/input
      # 任务结果落盘
      - ./output:/app/output
      # 监听器处理状态 (持久化, 避免重启后重复提交)
      - ./state:/app/state
      # 运行日志 (agent.log 滚动分割)
      - ./logs:/app/logs
    restart: unless-stopped
